<!DOCTYPE html>
<html>
  <head>
    <style>
      .btn {
        background-color: teal;
        color: white;
        padding: 10px;
        border: none;
        transition: background-color 0.4s ease;
        cursor: pointer;
      }
      .btn:hover { background-color: darkblue; }
    </style>
  </head>
  <body>
    <button class="btn">Hover Me</button>
  </body>
</html>
