<!DOCTYPE html>
<html>
  <head>
    <style>
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .header { grid-column: span 2; background: lightblue; }
      .box { background: lightgreen; height: 100px; }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="box header">Header</div>
      <div class="box">Box 1</div>
      <div class="box">Box 2</div>
    </div>
  </body>
</html>
