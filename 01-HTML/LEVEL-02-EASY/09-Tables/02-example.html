<!DOCTYPE html>
<html>
  <head>
    <title>Tables Example</title>
    <style>table, th, td { border: 1px solid black; border-collapse: collapse; padding: 6px; }</style>
  </head>
  <body>
    <table>
      <tr><th>Item</th><th>Price</th></tr>
      <tr><td>Apple</td><td>$1.00</td></tr>
      <tr><td>Milk</td><td>$2.00</td></tr>
    </table>
  </body>
</html>
