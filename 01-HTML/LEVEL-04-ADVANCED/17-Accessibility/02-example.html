<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Accessibility Example</title>
  </head>
  <body>
    <h1>Signup Form</h1>
    <form>
      <label for="usr">Username:</label>
      <input type="text" id="usr" required>
      <button aria-label="Submit registration form" type="submit">Sign Up</button>
    </form>
  </body>
</html>
