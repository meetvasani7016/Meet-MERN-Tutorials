<!DOCTYPE html>
<html>
  <head>
    <title>Input Types Example</title>
  </head>
  <body>
    <form>
      <p>Age: <input type="number" min="1"></p>
      <p>Plan: 
        <input type="radio" id="f" name="plan" value="free"> <label for="f">Free</label>
        <input type="radio" id="p" name="plan" value="pro"> <label for="p">Pro</label>
      </p>
    </form>
  </body>
</html>
