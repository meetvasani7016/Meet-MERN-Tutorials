<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tailwind Installation Methods</title>
  <!-- 1. Play CDN (For rapid learning & drafts) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="text-center">
    <h1 class="text-3xl font-semibold text-indigo-600">Tailwind Loaded!</h1>
    <!-- 2. CLI Method instructions (For professional builds)
      a. Install: npm install -D tailwindcss postcss autoprefixer
      b. Init config: npx tailwindcss init
      c. Build command: npx tailwindcss -i ./src/input.css -o ./dist/output.css --watch
    -->
  </div>
</body>
</html>
