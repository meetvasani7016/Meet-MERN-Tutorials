<!DOCTYPE html>
<html>
<head>

      .btn-pill {
        @apply bg-indigo-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-indigo-700 transition;
      }

</head>
<body class="p-8 bg-gray-50 flex justify-center">
  <button class="btn-pill">Pill Action</button>
</body>
</html>
