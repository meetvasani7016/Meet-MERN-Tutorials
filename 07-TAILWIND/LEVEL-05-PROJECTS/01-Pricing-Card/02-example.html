<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Card Tiers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen items-center justify-center p-6">
  <div class="max-w-5xl w-full">
    <div class="text-center mb-10">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Flexible Pricing Plans</h1>
      <p class="text-slate-400 mt-2">Choose the tier that matches your scope.</p>
    </div>

    <!-- Pricing Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <!-- Tier 1 -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col justify-between shadow-md">
        <div>
          <h3 class="text-xl font-bold">Starter</h3>
          <div class="mt-4 text-3xl font-extrabold">$19<span class="text-sm font-normal text-slate-400">/mo</span></div>
          <p class="text-slate-400 mt-3 text-sm">Perfect for beginners learning layouts.</p>
        </div>
        <button class="w-full mt-6 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl font-bold transition">Get Started</button>
      </div>

      <!-- Tier 2 (Highlighted) -->
      <div class="bg-slate-800 border-2 border-indigo-500 p-6 rounded-2xl flex flex-col justify-between shadow-xl relative transform md:-translate-y-2">
        <span class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-indigo-500 text-xs font-semibold px-3 py-1 rounded-full text-white">POPULAR</span>
        <div>
          <h3 class="text-xl font-bold text-white">Professional</h3>
          <div class="mt-4 text-3xl font-extrabold text-white">$49<span class="text-sm font-normal text-slate-400">/mo</span></div>
          <p class="text-slate-400 mt-3 text-sm">Best for production web designs.</p>
        </div>
        <button class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl font-bold shadow-md shadow-indigo-600/30 transition">Get Started</button>
      </div>

      <!-- Tier 3 -->
      <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col justify-between shadow-md">
        <div>
          <h3 class="text-xl font-bold">Enterprise</h3>
          <div class="mt-4 text-3xl font-extrabold">$99<span class="text-sm font-normal text-slate-400">/mo</span></div>
          <p class="text-slate-400 mt-3 text-sm">For full stack team coordination.</p>
        </div>
        <button class="w-full mt-6 bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-xl font-bold transition">Get Started</button>
      </div>
    </div>
  </div>
</body>
</html>
