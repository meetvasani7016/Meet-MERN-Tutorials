<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jane Doe | Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-2xl w-full bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-2xl">
    <div class="flex flex-col sm:flex-row items-center gap-6">
      <div class="w-24 h-24 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-full flex items-center justify-center text-white text-3xl font-extrabold">JD</div>
      <div class="text-center sm:text-left">
        <h1 class="text-2xl font-bold text-white">Jane Doe</h1>
        <p class="text-indigo-400">Junior Full Stack Developer</p>
        <p class="text-slate-400 text-sm mt-1">Based in Silicon Valley, building responsive MERN applications.</p>
      </div>
    </div>

    <!-- Skills Section -->
    <div class="mt-8">
      <h3 class="text-lg font-bold border-b border-slate-800 pb-2">Skills</h3>
      <div class="grid grid-cols-2 gap-4 mt-4">
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
          <div class="text-xs text-slate-500 font-semibold uppercase">Frontend</div>
          <div class="text-sm font-bold mt-1 text-white">React, Tailwind CSS</div>
        </div>
        <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
          <div class="text-xs text-slate-500 font-semibold uppercase">Backend</div>
          <div class="text-sm font-bold mt-1 text-white">Node.js, MongoDB</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
