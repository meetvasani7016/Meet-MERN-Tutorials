<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
    function toggleTheme() { document.documentElement.classList.toggle('dark'); }
  </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-800 dark:text-white min-h-screen flex flex-col items-center justify-center transition-colors duration-300">
  <h1 class="text-3xl font-extrabold mb-4">Dark Mode Toggle</h1>
  <button onclick="toggleTheme()" class="bg-indigo-600 text-white px-4 py-2 rounded-md shadow-md hover:bg-indigo-700">Toggle Theme</button>
</body>
</html>
